name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.1.0

      # checkMixinTargets catches descriptor drift that compiles fine but fails at server boot
      - run: gradle build checkMixinTargets

      - uses: actions/upload-artifact@v7
        with:
          name: OrbisGuard-Mixins
          path: build/libs/*.jar
